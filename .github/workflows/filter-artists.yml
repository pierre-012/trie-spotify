name: Filtrer les artistes francophones actifs

on:
  workflow_dispatch:
    inputs:
      max_artists:
        description: "Nombre maximum d'artistes à traiter lors de cette exécution (0 = tous)"
        required: false
        default: "500"
      min_monthly_listeners:
        description: "Auditeurs mensuels minimum (0 = aucun filtre)"
        required: false
        default: "0"

  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Filtrer les artistes
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          MAX_ARTISTS: ${{ github.event.inputs.max_artists || '500' }}
          MIN_MONTHLY_LISTENERS: ${{ github.event.inputs.min_monthly_listeners || '0' }}
        run: python scripts/filter_artists.py

      - name: Sauvegarder les résultats
        uses: actions/upload-artifact@v4
        with:
          name: artistes-filtres
          path: |
            output/artistes_actifs_2026.json
            output/artistes_francophones_2026.json
            output/rapport_exclusions.json
            output/state.json
          if-no-files-found: warn

      - name: Commit des résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "Mise à jour du filtrage des artistes"
          git push
