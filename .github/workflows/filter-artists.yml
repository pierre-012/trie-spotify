name: Filtrer les artistes francophones actifs

on:
  workflow_dispatch:
    inputs:
      max_artists:
        description: "Nombre maximum d'artistes à traiter (0 = tous)"
        required: false
        default: "25"
      min_monthly_listeners:
        description: "Auditeurs mensuels minimum (0 = aucun filtre)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Filtrer les artistes
        env:
          MAX_ARTISTS: ${{ github.event.inputs.max_artists || '25' }}
          MIN_MONTHLY_LISTENERS: ${{ github.event.inputs.min_monthly_listeners || '0' }}
        run: python scripts/filter_artists.py

      - uses: actions/upload-artifact@v4
        with:
          name: artistes-filtres
          path: output/
          if-no-files-found: warn

      - name: Commit des résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "Mise à jour du filtrage des artistes"
          git push
