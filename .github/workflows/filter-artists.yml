name: Filtrer les artistes francophones actifs

on:
  workflow_dispatch:
    inputs:
      max_artists:
        description: "Nombre maximum d'artistes à traiter (0 = tous)"
        required: false
        default: "0"
      min_monthly_listeners:
        description: "Auditeurs mensuels minimum (0 = aucun filtre)"
        required: false
        default: "0"

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Filtrer les artistes
        env:
          MAX_ARTISTS: ${{ github.event.inputs.max_artists || '0' }}
          MIN_MONTHLY_LISTENERS: ${{ github.event.inputs.min_monthly_listeners || '0' }}
        run: python scripts/filter_artists.py

      - name: Sauvegarder les résultats
        uses: actions/upload-artifact@v4
        with:
          name: artistes-filtres
          path: output/
          if-no-files-found: warn

      - name: Commit des résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "Aucun changement à committer."
          else
            git commit -m "Progression du filtrage des artistes"
            git pull --rebase
            git push
          fi
